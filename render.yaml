# Render Blueprint for evaluation. PostgreSQL is the case store (DATABASE_URL).
# Free PostgreSQL expires after its trial period and has no production-grade
# durability guarantee. Upgrade storage and configure verified backups before
# storing real investigations. The fallback SQLite path is development-only.
services:
  - type: web
    name: osintalpha-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: osintalpha-research-v3
          property: connectionString
      - key: OSINTALPHA_ADMIN_PASSWORD
        generateValue: true
      - key: OSINTALPHA_SECURE_COOKIE
        value: "1"
      - key: OSINTALPHA_DB_PATH
        value: /srv/app/instance/osintalpha.db
      - key: XAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: TFL_APP_KEY
        sync: false

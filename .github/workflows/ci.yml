name: OSINT Alpha checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c8d0c03ef # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
          pip install -r requirements.txt
      - run: python -m compileall -q app run.py
      - run: pytest -q
      - run: node --check static/console.js
      - run: node --check static/app.js
